# ==============================================================================
# NIFTY Quantitative Market Analysis Engine Settings
# ==============================================================================

collector:
  interval_seconds: 300       # 5 minutes polling interval
  timeout_seconds: 15
  max_retries: 3
  retry_delay_seconds: 2.0
  min_request_gap_seconds: 3.0 # Guard against aggressive polling

  # Trading hours gate (IST) — periodic background collection window
  trading_hours:
    start_hour: 8              # 8:00 AM IST
    start_minute: 0
    end_hour: 14               # 2:00 PM IST
    end_minute: 0
    timezone: "Asia/Kolkata"
    weekdays_only: false       # Allow collection on all days if desired

  # Target Indices to track
  indices:
    - "NIFTY 50"
    - "NIFTY BANK"
    - "NIFTY FINANCIAL SERVICES"
    - "NIFTY IT"
    - "NIFTY AUTO"
    - "NIFTY FMCG"
    - "NIFTY PHARMA"
    - "NIFTY METAL"
    - "NIFTY PSU BANK"
    - "NIFTY PRIVATE BANK"
    - "NIFTY OIL & GAS"
    - "NIFTY REALTY"
    - "NIFTY MEDIA"
    - "NIFTY CONSUMER DURABLES"
    - "INDIA VIX"
    - "NIFTY MIDCAP 100"           # Phase 1: Style rotation signal (Largecap vs Midcap)

  # Macro indicators (Phase 2: expanded from 6 to 12 signals)
  macro_tickers:
    # --- Existing: US & Japan equity proxies ---
    brent_crude: "BZ=F"
    wti_crude: "CL=F"
    usd_inr: "USDINR=X"
    sp500: "^GSPC"
    nasdaq: "^IXIC"
    nikkei: "^N225"
    # --- Phase 2 New: Safe haven, growth proxy, currency, Asia sentiment ---
    gold_spot: "GC=F"            # Safe-haven proxy (inverse risk appetite)
    copper_spot: "HG=F"          # Dr. Copper: economic growth indicator
    dxy: "DX-Y.NYB"                  # US Dollar Index (ICE Futures; inverse of INR/EM strength)
    hang_seng: "^HSI"            # China/Asia macro sentiment (pre-market signal)
    kospi: "^KS11"               # Korea tech cycle (semiconductor bellwether)
    singapore_sti: "^STI"        # Singapore — Asia regional proxy
    # Phase 3 Option B: GSec via yfinance
    india_gsec_10y: "^INDIAGOV10Y" # Note: currently delisted on YF; falls back to 0.0

# ==============================================================================
# Signal & Sector Weighting Model Configuration
# ==============================================================================
signals:
  # Sector weights roughly aligned with NIFTY 50 sectoral representation
  sector_weights:
    "NIFTY BANK": 0.28
    "NIFTY FINANCIAL SERVICES": 0.12
    "NIFTY IT": 0.15
    "NIFTY OIL & GAS": 0.12
    "NIFTY AUTO": 0.08
    "NIFTY FMCG": 0.08
    "NIFTY METAL": 0.05
    "NIFTY PHARMA": 0.04
    "NIFTY CONSUMER DURABLES": 0.03
    "NIFTY REALTY": 0.02
    "NIFTY PSU BANK": 0.02
    "NIFTY MEDIA": 0.01

  # Composite score component contributions (must sum to 1.0)
  # Phase 5 updated: 4-component → 6-component architecture
  component_weights:
    momentum: 0.35          # ↓ from 0.40 — shares weight with new signals
    relative_strength: 0.20 # ↓ from 0.25
    breadth: 0.15           # ↓ from 0.20
    macro: 0.15             # unchanged — but now covers 12 indicators
    style_rotation: 0.10    # NEW: NIFTY Midcap 100 vs NIFTY 50 rotation
    banking_structure: 0.05 # NEW: PSU Bank vs Private Bank risk appetite

  # Regime classification thresholds (-100 to +100)
  regime_thresholds:
    bullish: 60.0
    mildly_bullish: 30.0
    mildly_bearish: -30.0
    bearish: -60.0

nse:
  base_url: "https://www.nseindia.com"
  all_indices_endpoint: "/api/allIndices"
  session_refresh_minutes: 4

database:
  sqlite_path: "data/raw/market_data.db"
  echo_sql: false

logging:
  level: "INFO"
  format: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
