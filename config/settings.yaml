# ==============================================================================
# NIFTY Quantitative Market Analysis Engine Settings
# ==============================================================================

collector:
  interval_seconds: 300       # 5 minutes polling interval
  timeout_seconds: 15
  max_retries: 3
  retry_delay_seconds: 2.0
  min_request_gap_seconds: 3.0 # Guard against aggressive polling

  # Target Indices to track
  indices:
    - "NIFTY 50"
    - "NIFTY BANK"
    - "NIFTY FINANCIAL SERVICES"
    - "NIFTY IT"
    - "NIFTY AUTO"
    - "NIFTY FMCG"
    - "NIFTY PHARMA"
    - "NIFTY METAL"
    - "NIFTY PSU BANK"
    - "NIFTY PRIVATE BANK"
    - "NIFTY OIL & GAS"
    - "NIFTY REALTY"
    - "NIFTY MEDIA"
    - "NIFTY CONSUMER DURABLES"
    - "INDIA VIX"

  # Macro indicators
  macro_tickers:
    brent_crude: "BZ=F"
    wti_crude: "CL=F"
    usd_inr: "USDINR=X"
    sp500: "^GSPC"
    nasdaq: "^IXIC"
    nikkei: "^N225"

# ==============================================================================
# Signal & Sector Weighting Model Configuration
# ==============================================================================
signals:
  # Sector weights roughly aligned with NIFTY 50 sectoral representation
  sector_weights:
    "NIFTY BANK": 0.28
    "NIFTY FINANCIAL SERVICES": 0.12
    "NIFTY IT": 0.15
    "NIFTY OIL & GAS": 0.12
    "NIFTY AUTO": 0.08
    "NIFTY FMCG": 0.08
    "NIFTY METAL": 0.05
    "NIFTY PHARMA": 0.04
    "NIFTY CONSUMER DURABLES": 0.03
    "NIFTY REALTY": 0.02
    "NIFTY PSU BANK": 0.02
    "NIFTY MEDIA": 0.01

  # Composite score component contributions (must sum to 1.0)
  component_weights:
    momentum: 0.40
    relative_strength: 0.25
    breadth: 0.20
    macro: 0.15

  # Regime classification thresholds (-100 to +100)
  regime_thresholds:
    bullish: 60.0
    mildly_bullish: 30.0
    mildly_bearish: -30.0
    bearish: -60.0

nse:
  base_url: "https://www.nseindia.com"
  all_indices_endpoint: "/api/allIndices"
  session_refresh_minutes: 4

database:
  sqlite_path: "data/raw/market_data.db"
  echo_sql: false

logging:
  level: "INFO"
  format: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
