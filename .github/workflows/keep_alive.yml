name: Keep-Alive Cron - 24/7 Render Anti-Sleep Pulse

on:
  schedule:
    # Trigger every 10 minutes 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    name: "Ping Render Web Service"
    runs-on: ubuntu-latest

    steps:
      - name: "Send Keep-Alive Ping"
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          TARGET_URL="${SERVICE_URL:-https://quantnifty.onrender.com/api/health}"
          echo "Pinging Render service at: $TARGET_URL"
          response=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL")
          echo "Received HTTP status: $response"
          if [ "$response" -eq 200 ] || [ "$response" -eq 304 ]; then
            echo "Render service is awake and healthy!"
          else
            echo "Warning: Received HTTP $response from Render service."
          fi
