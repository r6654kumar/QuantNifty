name: CI/CD Pipeline - QuantNifty Render Deployment

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ============================================================================
  # 1. CI Phase: Run Automated Tests & Validation
  # ============================================================================
  test:
    name: 🧪 Run Unit Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Pytest Suite
        env:
          DATABASE_URL: sqlite:///:memory:
          LOG_LEVEL: INFO
        run: |
          pytest tests/ -v

  # ============================================================================
  # 2. CD Phase: Deploy to Render (Triggered only on master/main push after CI passes)
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Render Web Service
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub repository."
            echo "Skipping automatic Render trigger. To enable automatic CD, set RENDER_DEPLOY_HOOK_URL in Repository Secrets."
          else
            echo "🚀 Triggering Render Deployment..."
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_HOOK")
            if [ "$response" -eq 200 ] || [ "$response" -eq 201 ] || [ "$response" -eq 202 ]; then
              echo "✅ Render deployment successfully triggered! (HTTP $response)"
            else
              echo "❌ Render deployment hook failed with HTTP status: $response"
              exit 1
            fi
          fi
